global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'middleware'
    static_configs:
      - targets: ['middleware:8000']
    metrics_path: '/metrics'
    params:
      format: ['text/plain']

  - job_name: 'course-service'
    static_configs:
      - targets: ['course-service:8000']
    metrics_path: '/metrics'
    params:
      format: ['text/plain']

  - job_name: 'enrollment-service'
    static_configs:
      - targets: ['enrollment-service:8000']
    metrics_path: '/metrics'
    params:
      format: ['text/plain']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
