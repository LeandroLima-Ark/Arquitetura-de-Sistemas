services:
  middleware:
    build: ./middleware
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      course-service:
        condition: service_started
      enrollment-service:
        condition: service_started
    environment:
      - COURSE_SERVICE_URL=http://course-service:8000
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:8000
      - RABBITMQ_HOST=rabbitmq

  course-service:
    build: ./services/course-service
    ports:
      - "8001:8000"

  enrollment-service:
    build: ./services/enrollment-service
    ports:
      - "8002:8000"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  notification-worker:
    build: ./services/notification-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RABBITMQ_HOST=rabbitmq
